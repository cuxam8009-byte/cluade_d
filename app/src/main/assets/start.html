<!doctype html>
<html lang="vi" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Dymith</title>
<style>
:root {
  color-scheme: dark light;
  --bg: #080808;
  --surface: #151515;
  --surface-2: #202020;
  --ink: #f7f7f7;
  --muted: #929292;
  --line: #292929;
  --accent: #f7f7f7;
  --shadow: 0 12px 36px #0008;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fafafa;
  --surface: #f0f0f0;
  --surface-2: #e7e7e7;
  --ink: #111;
  --muted: #777;
  --line: #dedede;
  --accent: #111;
  --shadow: 0 12px 36px #00000012;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="system"] {
    color-scheme: light;
    --bg: #fafafa; --surface: #f0f0f0; --surface-2: #e7e7e7;
    --ink: #111; --muted: #777; --line: #dedede; --accent: #111;
    --shadow: 0 12px 36px #00000012;
  }
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .2s ease, color .2s ease;
}
button, input { font: inherit; }
button { color: inherit; }
.app {
  position: relative;
  width: min(100%, 560px);
  height: 100dvh;
  min-height: 480px;
  margin: 0 auto;
  padding: calc(24px + var(--safe-top)) 20px calc(104px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.greeting { margin: 0; color: var(--muted); font-size: 14px; }
.clock {
  margin: 2px 0 0;
  font-size: clamp(64px, 21vw, 94px);
  line-height: .98;
  font-weight: 300;
  letter-spacing: -.065em;
  font-variant-numeric: tabular-nums;
}
.date { margin: 9px 0 0; color: var(--muted); font-size: 14px; text-transform: capitalize; }
.theme {
  width: 44px; height: 44px; flex: 0 0 44px;
  border: 1px solid var(--line); border-radius: 50%;
  background: var(--surface); display: grid; place-items: center;
  cursor: pointer;
}
.theme svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.section-title { margin: 34px 0 16px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .13em; text-transform: uppercase; }
.shortcuts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 22px 10px;
  align-content: start;
}
.shortcut {
  min-width: 0; min-height: 88px; padding: 0;
  border: 0; background: transparent; display: flex;
  flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer;
}
.shortcut-icon {
  width: 58px; height: 58px; border-radius: 20px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 18px; font-weight: 650; letter-spacing: -.04em;
  transition: transform .16s ease, background .16s ease;
}
.shortcut:active .shortcut-icon { transform: scale(.93); background: var(--surface-2); }
.shortcut-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
.dock {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 12px 14px calc(12px + var(--safe-bottom));
  background: linear-gradient(transparent, var(--bg) 25%);
}
.search {
  display: flex; align-items: center; gap: 9px;
  min-height: 60px; padding: 6px 7px 6px 15px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 32px; box-shadow: var(--shadow);
}
.search-icon { width: 22px; height: 22px; flex: 0 0 22px; color: var(--muted); }
.search-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; }
.query {
  min-width: 0; width: 100%; height: 44px; border: 0; outline: 0;
  color: var(--ink); background: transparent; font-size: 15px;
}
.query::placeholder { color: var(--muted); opacity: 1; }
.submit {
  width: 46px; height: 46px; flex: 0 0 46px; border: 0;
  border-radius: 50%; display: grid; place-items: center;
  color: var(--bg); background: var(--ink); cursor: pointer;
}
.submit svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.splash {
  position: absolute; z-index: 3; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg); pointer-events: none;
  animation: splash-out .42s ease 1.55s forwards;
}
.logo { width: min(58vw, 230px); height: auto; }
.logo .circle, .logo .hex { fill: none; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .65s ease-out forwards; }
.logo .hex { animation-delay: .16s; }
.wordmark { margin: 12px 0 0; font-size: 39px; letter-spacing: -.055em; font-weight: 300; opacity: 0; animation: rise .45s ease .55s forwards; }
.wordmark b { font-family: ui-monospace, monospace; font-weight: 750; }
.tagline { margin: 8px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: 0; animation: rise .4s ease .72s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
@keyframes splash-out { to { opacity: 0; visibility: hidden; } }
@media (max-width: 360px) {
  .app { padding-left: 16px; padding-right: 16px; }
  .shortcuts { gap: 16px 6px; }
  .shortcut-icon { width: 52px; height: 52px; border-radius: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <p class="greeting" id="greeting">Xin chào</p>
      <h1 class="clock" id="clock">00:00</h1>
      <p class="date" id="date"></p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Chuyển giao diện sáng tối" title="Sáng / tối">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
    </button>
  </header>

  <h2 class="section-title">Truy cập nhanh</h2>
  <section class="shortcuts" id="shortcuts" aria-label="Trang web yêu thích"></section>

  <form class="dock" id="searchForm" role="search">
    <div class="search">
      <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>
      <input class="query" id="query" type="search" placeholder="Tìm kiếm hoặc nhập địa chỉ" autocomplete="off" autocapitalize="none" enterkeyhint="go" aria-label="Tìm kiếm hoặc nhập địa chỉ">
      <button class="submit" type="submit" aria-label="Tìm kiếm">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </form>

  <section class="splash" id="splash" aria-label="Dymith đang khởi động">
    <svg class="logo" viewBox="0 0 232 200" aria-hidden="true">
      <circle class="circle" cx="96" cy="100" r="52" pathLength="1"/>
      <path class="hex" pathLength="1" d="M136 48 181 74v52l-45 26-45-26V74Z"/>
    </svg>
    <p class="wordmark">Dym<b>ith</b></p>
    <p class="tagline">Browse without friction</p>
  </section>
</main>
<script>
(() => {
  "use strict";
  const root = document.documentElement;
  const clock = document.getElementById("clock");
  const greeting = document.getElementById("greeting");
  const date = document.getElementById("date");
  const query = document.getElementById("query");
  const shortcuts = [
    ["YouTube", "YT", "https://www.youtube.com/"],
    ["Facebook", "f", "https://www.facebook.com/"],
    ["Zalo", "Z", "https://zalo.me/"],
    ["Shopee", "S", "https://shopee.vn/"],
    ["VnExpress", "V", "https://vnexpress.net/"],
    ["Google", "G", "https://www.google.com/"],
    ["Maps", "M", "https://maps.google.com/"],
    ["TikTok", "T", "https://www.tiktok.com/"]
  ];

  function updateClock() {
    const now = new Date();
    const hour = now.getHours();
    greeting.textContent = hour < 11 ? "Chào buổi sáng" : hour < 14 ? "Chào buổi trưa" : hour < 18 ? "Chào buổi chiều" : "Chào buổi tối";
    clock.textContent = new Intl.DateTimeFormat("vi-VN", {hour:"2-digit", minute:"2-digit", hour12:false}).format(now);
    date.textContent = new Intl.DateTimeFormat("vi-VN", {weekday:"long", day:"numeric", month:"long"}).format(now);
  }

  function openUrl(url) {
    if (!/^https?:\/\//i.test(url)) return;
    if (window.Dymith && typeof window.Dymith.open === "function") window.Dymith.open(url);
    else window.location.href = url;
  }

  const fragment = document.createDocumentFragment();
  shortcuts.forEach(([name, initials, url]) => {
    const button = document.createElement("button");
    button.className = "shortcut";
    button.type = "button";
    button.setAttribute("aria-label", "Mở " + name);
    const icon = document.createElement("span");
    icon.className = "shortcut-icon";
    icon.textContent = initials;
    const label = document.createElement("span");
    label.className = "shortcut-name";
    label.textContent = name;
    button.append(icon, label);
    button.addEventListener("click", () => openUrl(url));
    fragment.append(button);
  });
  document.getElementById("shortcuts").append(fragment);

  document.getElementById("searchForm").addEventListener("submit", event => {
    event.preventDefault();
    const value = query.value.trim();
    if (!value) { query.focus(); return; }
    const looksLikeUrl = /^(https?:\/\/)/i.test(value) || (/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(value) && !/\s/.test(value));
    if (looksLikeUrl) openUrl(value.startsWith("http") ? value : "https://" + value);
    else if (window.Dymith && typeof window.Dymith.search === "function") window.Dymith.search(value);
    else openUrl("https://www.google.com/search?q=" + encodeURIComponent(value));
  });

  function syncSystemBars(isDark) {
    if (window.Dymith && typeof window.Dymith.setTheme === "function") window.Dymith.setTheme(Boolean(isDark));
  }

  document.getElementById("theme").addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    document.querySelector('meta[name="theme-color"]').content = next === "dark" ? "#080808" : "#fafafa";
    syncSystemBars(next === "dark");
  });

  updateClock();
  syncSystemBars(root.dataset.theme === "dark" || (root.dataset.theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches));
  window.setInterval(updateClock, 15000);
})();
</script>
</body>
</html>
