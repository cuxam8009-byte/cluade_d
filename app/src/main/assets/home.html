<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Dymith</title>
<style>
:root{color-scheme:dark;--bg:#080808;--ink:#f7f7f7;--muted:#929292;--surface:#171717;--line:#292929;--shadow:0 12px 34px #0008;box-sizing:border-box}
:root[data-theme="light"]{color-scheme:light;--bg:#fafafa;--ink:#101010;--muted:#777;--surface:#f0f0f0;--line:#dedede;--shadow:0 10px 30px #0000000c}
*,:before,:after{box-sizing:inherit}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{color:inherit}.app{height:100%;height:100dvh;max-width:560px;margin:auto;position:relative;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.home{height:100%;display:flex;flex-direction:column;padding:28px 0 96px}.top{padding:0 25px;margin-bottom:auto}.hello{margin:0;color:var(--muted);font-size:14px}
.clock{font-size:clamp(72px,23vw,108px);font-weight:300;letter-spacing:-.065em;line-height:.98;margin:4px 0 0;font-variant-numeric:tabular-nums}.date{margin:10px 0 0;color:var(--muted);font-size:14px;text-transform:capitalize}
.arc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 4px;padding:8px 16px 14px;margin-top:32px}.shortcut{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;border:0;background:none;padding:0;cursor:pointer}
.shortcut:nth-child(4n+1),.shortcut:nth-child(4n){transform:translateY(-12px)}.ic{width:58px;height:58px;border:1px solid var(--line);border-radius:20px;display:grid;place-items:center;background:var(--surface);font-size:20px;font-weight:650;letter-spacing:-.04em}
.shortcut small{font-size:12px;color:var(--muted);white-space:nowrap}.dock{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom))}
.search{height:60px;border:1px solid var(--line);border-radius:32px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:6px;box-shadow:var(--shadow)}
.engine,.go{width:46px;height:46px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted)}.engine{color:var(--ink)}
.engine svg,.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px}.search input::placeholder{color:var(--muted)}.go{background:var(--ink);color:var(--bg);cursor:pointer}
.controls{position:absolute;right:18px;top:calc(12px + env(safe-area-inset-top))}.control{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted)}
.splash{position:absolute;inset:0 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);pointer-events:none}
.mark svg{width:min(62vw,260px);height:auto;display:block;overflow:visible}.ln{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.in{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:0}.gl,.neg{fill:none;stroke-width:1.4;opacity:0}.gl{stroke:var(--ink)}.neg{stroke:var(--bg)}
.fuse{fill:var(--ink);opacity:0}.riv{fill:var(--bg);stroke:var(--ink);stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center}.ring{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}.pc,.ph{opacity:0}
.wm{display:flex;align-items:baseline;margin:12px 0 0;font-size:clamp(38px,11vw,48px);line-height:1;letter-spacing:-.06em;font-weight:650}.wm i{font-style:normal;display:inline-block;opacity:0}.cap{margin:13px 0 0;color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:0}
.run .pc{animation:inL .65s cubic-bezier(.2,.8,.2,1) forwards}.run .ph{animation:inR .65s cubic-bezier(.2,.8,.2,1) forwards}.run .ln{animation:draw .65s ease-out forwards}
.run .in,.run .gl{animation:fade .35s ease-out .5s forwards}.run .riv{animation:pop .35s ease-out calc(.55s + var(--i)*.04s) forwards}.run .fuse{animation:fade .25s ease-out .9s forwards}
.run .neg{animation:fade .3s ease-out 1s forwards}.run .ring{animation:ring .7s ease-out .9s forwards}.run .wm i{animation:rise .45s cubic-bezier(.2,.8,.2,1) calc(1s + var(--i)*.05s) forwards}
.run .cap{animation:fade .4s ease-out 1.45s forwards}.run .splash{animation:leave .5s ease-in 2.1s forwards}.run .top{animation:rise .55s cubic-bezier(.2,.8,.2,1) 2.25s both}
.run .arc .shortcut{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(2.35s + var(--i)*45ms)}.run .dock{animation:rise .55s cubic-bezier(.2,.8,.2,1) 2.35s both}
@keyframes inL{from{opacity:1;transform:translateX(-64px)}to{opacity:1;transform:none}}@keyframes inR{from{opacity:1;transform:translateX(64px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(0)}65%{opacity:1;transform:scale(1.45)}100%{opacity:1;transform:scale(1)}}
@keyframes ring{from{opacity:.65;transform:scale(.3)}to{opacity:0;transform:scale(1.9)}}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes leave{to{opacity:0;transform:translateY(-12px) scale(.98)}}
@media(max-height:680px){.home{padding-top:18px}.clock{font-size:68px}.arc{margin-top:14px;gap:14px 4px}.ic{width:50px;height:50px;border-radius:17px}}
@media(prefers-reduced-motion:reduce){.run *{animation-duration:.01ms!important;animation-delay:0ms!important}.splash{display:none}}
</style></head>
<body><main class="app" id="app">
<section class="home"><header class="top"><p class="hello" id="hello">Xin chào</p><h1 class="clock" id="clock">00:00</h1><p class="date" id="date"></p></header><section class="arc" id="arc" aria-label="Trang web yêu thích"></section></section>
<div class="controls"><button class="control" id="theme" aria-label="Đổi giao diện">◐</button></div>
<div class="splash" id="splash"><div class="mark"><svg viewBox="0 0 232 200" aria-hidden="true">
<defs><clipPath id="cc"><circle cx="96" cy="100" r="52"/></clipPath><clipPath id="hx"><path d="M136 48L181 74V126L136 152L91 126V74Z"/></clipPath><g id="gb"><ellipse cx="96" cy="100" rx="24" ry="52"/><path d="M44 100H148M50 76H142M50 124H142"/></g></defs>
<g class="pc"><circle class="ln" cx="96" cy="100" r="52" pathLength="1"/><use href="#gb" class="gl"/></g><g class="ph"><path class="ln" pathLength="1" d="M136 48L181 74V126L136 152L91 126V74Z"/><path class="in" d="M136 66L165 83V117L136 134L107 117V83Z"/></g>
<g clip-path="url(#cc)"><path class="fuse" d="M136 48L181 74V126L136 152L91 126V74Z"/><use href="#gb" class="neg" clip-path="url(#hx)"/></g>
<circle class="riv" style="--i:0" cx="136" cy="48" r="3.4"/><circle class="riv" style="--i:1" cx="181" cy="74" r="3.4"/><circle class="riv" style="--i:2" cx="181" cy="126" r="3.4"/><circle class="riv" style="--i:3" cx="136" cy="152" r="3.4"/><circle class="riv" style="--i:4" cx="91" cy="126" r="3.4"/><circle class="riv" style="--i:5" cx="91" cy="74" r="3.4"/><circle class="ring" cx="116" cy="100" r="40"/></svg></div>
<h1 class="wm"><i style="--i:0">D</i><i style="--i:1">y</i><i style="--i:2">m</i><i style="--i:3">i</i><i style="--i:4">t</i><i style="--i:5">h</i></h1><p class="cap">A calmer way to browse</p></div>
<div class="dock"><form class="search" id="searchForm"><button class="engine" type="button" aria-label="Tìm kiếm bằng Google"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></button><input id="query" autocomplete="off" autocapitalize="none" placeholder="Tìm kiếm hoặc nhập địa chỉ" aria-label="Tìm kiếm hoặc nhập địa chỉ"><button class="go" type="submit" aria-label="Đi tới"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form></div>
</main>
<script>
const root=document.documentElement;
const shortcuts=[{name:"YouTube",letter:"▶",url:"https://m.youtube.com"},{name:"Facebook",letter:"f",url:"https://m.facebook.com"},{name:"Zalo",letter:"Z",url:"https://chat.zalo.me"},{name:"Shopee",letter:"S",url:"https://shopee.vn"},{name:"VnExpress",letter:"V",url:"https://vnexpress.net"},{name:"Google",letter:"G",url:"https://www.google.com"},{name:"Maps",letter:"⌖",url:"https://maps.google.com"},{name:"TikTok",letter:"♪",url:"https://www.tiktok.com"}];
const arc=document.getElementById("arc");
shortcuts.forEach((item,index)=>{const button=document.createElement("button");button.className="shortcut";button.style.setProperty("--i",index);button.type="button";const icon=document.createElement("span");icon.className="ic";icon.textContent=item.letter;const label=document.createElement("small");label.textContent=item.name;button.append(icon,label);button.addEventListener("click",()=>window.Dymith&&Dymith.open(item.url));arc.append(button);});
function updateClock(){const now=new Date(),h=now.getHours();document.getElementById("hello").textContent=h<11?"Chào buổi sáng":h<14?"Chào buổi trưa":h<18?"Chào buổi chiều":"Chào buổi tối";document.getElementById("clock").textContent=now.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",hour12:false});document.getElementById("date").textContent=now.toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long"});}
updateClock();setInterval(updateClock,30000);
document.getElementById("searchForm").addEventListener("submit",event=>{event.preventDefault();const value=document.getElementById("query").value.trim();if(value&&window.Dymith)Dymith.search(value);});
document.querySelector(".engine").addEventListener("click",()=>document.getElementById("query").focus());
document.getElementById("theme").addEventListener("click",()=>{const dark=root.dataset.theme!=="light";root.dataset.theme=dark?"light":"dark";if(window.Dymith)Dymith.setTheme(!dark);});
window.addEventListener("load",()=>{document.getElementById("app").classList.add("run");if(window.Dymith)Dymith.setTheme(true);});
</script></body></html>
